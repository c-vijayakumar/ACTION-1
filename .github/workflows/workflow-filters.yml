name: WOrkflow Filter and Activities

on:
    workflow_dispatch:
    # schedule:
    #   - cron: "*/59 * * * *"
    push:
      branches:
        - main              # run the worokflow if any changes pushed to the main branch
        - '!feature/*'      # ignore running the workflow for these branches using ! 
    
    #   branches-ignore:    # whenever pushing to the below metioned branches, this workflow not going to be run
    #     - feature/*       # feature/add-mushc, feature/updateImages - * means feature/add-music
    #     - test/**         # test/ui/index, test/checkout/payment/  - ** means test/ui/index
    pull_request:
      types:
        - opened
        - closed
      paths-ignore:         # workflow will only run when a pull request that inclues a change on any file other than README.md 
        - README.md
      branches:
        - main              # confgures workflow to only run on pull requests that target specific branches.

jobs:
    hello:
        runs-on: ubuntu-latest
        steps:
        - run: echo this workflow/job/step is executed for event tupe - ${{ github.event_name }}
